# Referenz-Konfiguration des Reverse Proxy (Stand: Härtung Prio 1+2).
# Auf dem Server liegt sie unter /etc/nginx/sites-available/selfiewall,
# die limit_req-Zonen unter /etc/nginx/conf.d/selfiewall-limits.conf.
# Die ssl_*-Zeilen verwaltet Certbot.
#
# --- /etc/nginx/conf.d/selfiewall-limits.conf ---
# limit_req_zone $binary_remote_addr zone=sw_auth:10m   rate=10r/m;
# limit_req_zone $binary_remote_addr zone=sw_write:10m  rate=600r/m;
#
# Hinweis zu den Limits: Auf einer Veranstaltung teilen sich alle Gäste eine
# öffentliche IP (WLAN-/Mobilfunk-NAT). Schreib-Limits sind deshalb bewusst
# großzügig – sie bremsen automatisierte Fluten, nicht die Feier. Der
# eigentliche Spam-Schutz sitzt in der App und zählt pro Gerät.

upstream selfiewall_app {
    server 127.0.0.1:3006;
    keepalive 16;
}

server {
    server_name selfiewall.littleproject.de;

    client_max_body_size 20m;

    # HSTS: nur hier, da nginx TLS terminiert
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Anmeldung: enge Bremse gegen Passwort-Raten (nur Veranstalter nutzen das)
    location /api/auth/ {
        limit_req zone=sw_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://selfiewall_app;
        include /etc/nginx/snippets/selfiewall-proxy.conf;
    }

    # Schreibende Gäste-Endpunkte
    location ~ ^/api/(e/[^/]+/(upload|photos/[^/]+/like)|admin/events/[^/]+/batch)$ {
        limit_req zone=sw_write burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://selfiewall_app;
        include /etc/nginx/snippets/selfiewall-proxy.conf;
    }

    # SSE-Stream der Wall: nicht puffern, lange offen halten.
    # Bewusst ohne limit_conn – hunderte Gäste hinter einer NAT-IP sind normal.
    location ~ ^/api/e/[^/]+/stream$ {
        proxy_pass http://selfiewall_app;
        include /etc/nginx/snippets/selfiewall-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://selfiewall_app;
        include /etc/nginx/snippets/selfiewall-proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/selfiewall.littleproject.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/selfiewall.littleproject.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = selfiewall.littleproject.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name selfiewall.littleproject.de;
    return 404; # managed by Certbot
}

