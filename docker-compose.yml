services:
  selfiewall:
    build: .
    image: selfiewall:latest
    restart: unless-stopped
    ports:
      # Auf dem Server z. B. SELFIEWALL_BIND=127.0.0.1:3005 setzen (nur lokal
      # erreichbar, nginx macht HTTPS davor)
      - "${SELFIEWALL_BIND:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      # Öffentliche Basis-URL (wichtig für QR-Codes und Auth-Cookies)
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      # Langer zufälliger String, z. B. via: openssl rand -base64 32
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET setzen}
      # Auf "true" setzen, um weitere Veranstalter-Accounts zuzulassen
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
